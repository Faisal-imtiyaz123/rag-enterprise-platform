server.port=8080

spring.application.name=rag-enterprise-platform

# H2 In-Memory Database with console enabled
spring.datasource.url=jdbc:h2:mem:ragdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart File Upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Default Admin API Key for Role-Based Access Control
rag.admin.api-key=adminkey123

# Default LLM Provider: GEMINI, OPENAI, or MOCK_HYBRID
rag.llm.provider=GEMINI
rag.llm.gemini.api-key=${GEMINI_API_KEY:}
rag.llm.gemini.model=gemini-2.5-flash-lite
rag.llm.openai.api-key=${OPENAI_API_KEY:}
rag.llm.openai.model=gpt-4o-mini

# Guardrailing threshold & strictness
rag.guardrails.enabled=true
rag.guardrails.block-toxic=true
rag.guardrails.block-jailbreak=true
rag.guardrails.mask-pii=true
rag.guardrails.max-query-length=500
